---
- name: SSH hardening configuration file is present
  ansible.builtin.copy:
    src: ssh_conf/00-ssh-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-ssh-hardening.conf
    owner: root
    group: root
    mode: '0400'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Bootstrap SSH hardening file is absent
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/bootstrap-ssh-hardening.conf"
    state: absent
  notify: Reload sshd
